name: AIPaint tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_test.py
      - run: python scripts/render.py examples/slime.json --output outputs/render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aipaint-test-results
          path: outputs/
          if-no-files-found: ignore
          retention-days: 7
